<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets" xmlns:p="http://primefaces.org/ui" template="/WEB-INF/template/template.xhtml">
    <f:metadata>
        <f:viewAction action="#{usageBean.load}" onPostBack="false" />
    </f:metadata>

    <ui:define name="title">Consumo - MINDALAI Platform Management</ui:define>
    <ui:define name="viewname">Consumo</ui:define>

    <ui:define name="content">

        <p:growl id="messages" showDetail="false" life="7000" />

        <div class="grid crud-demo">
            <div class="col-12">
                <h1 class="text-3xl font-medium">Consumo</h1>
                <p class="text-color-secondary">Metricas ingeridas por tenant e instalacion</p>
            </div>

            <div class="col-12">
                <div class="card">
                    <div class="card-content">
                        <h:form id="filterForm">
                            <div class="formgrid grid">
                                <div class="field col-12 md:col-4">
                                    <p:outputLabel for="from" value="Desde" />
                                    <p:datePicker id="from" value="#{usageBean.from}" styleClass="w-full"
                                        dateFormat="dd/MM/yyyy" showIcon="true" />
                                </div>
                                <div class="field col-12 md:col-4">
                                    <p:outputLabel for="to" value="Hasta" />
                                    <p:datePicker id="to" value="#{usageBean.to}" styleClass="w-full"
                                        dateFormat="dd/MM/yyyy" showIcon="true" />
                                </div>
                                <div class="field col-12 md:col-4 flex align-items-end">
                                    <p:commandButton id="summaryButton" value="Recalcular resumen" icon="pi pi-refresh"
                                        update=":summaryTable :messages" process="@form"
                                        action="#{usageBean.refreshSummary}" styleClass="w-full" />
                                </div>
                            </div>
                        </h:form>

                        <h:form id="listForm">
                            <p:toolbar styleClass="mb-4">
                                <p:toolbarGroup>
                                    <p:commandButton id="newButton" value="Registrar consumo" icon="pi pi-plus"
                                        styleClass="ui-button-success" process="@this" update=":usageDialog :messages"
                                        action="#{usageBean.openNew}" oncomplete="PF('usageDialogWidget').show()" />
                                </p:toolbarGroup>
                                <p:toolbarGroup align="right">
                                    <p:commandButton id="exportPdf" value="PDF" icon="pi pi-file-pdf" process="@this"
                                        update="@none" styleClass="ml-1 ui-button-danger">
                                        <p:dataExporter type="pdf" target="latestTable" fileName="consumo" />
                                    </p:commandButton>
                                    <p:commandButton id="exportExcel" value="Excel" icon="pi pi-file-excel"
                                        process="@this" update="@none" styleClass="ml-1 ui-button-success">
                                        <p:dataExporter type="xlsx" target="latestTable" fileName="consumo" />
                                    </p:commandButton>
                                    <p:commandButton id="exportCsv" value="CSV" icon="pi pi-table" process="@this"
                                        update="@none" styleClass="ml-1 ui-button-info">
                                        <p:dataExporter type="csv" target="latestTable" fileName="consumo" />
                                    </p:commandButton>
                                </p:toolbarGroup>
                            </p:toolbar>

                            <p:dataTable id="latestTable" widgetVar="latestTableWidget" var="row"
                                value="#{usageBean.latest}" reflow="true" rowIndexVar="rowIdx" paginator="true"
                                rows="10" paginatorPosition="bottom" emptyMessage="Sin registros de consumo">
                                <f:facet name="header">
                                    <div class="products-table-header">
                                        <span style="font-weight: bold">Ultimos registros</span>
                                        <span class="text-color-secondary">#{usageBean.latest.size()} registros</span>
                                    </div>
                                </f:facet>

                                <p:column headerText="Nro." style="width:4rem">
                                    <h:outputText value="#{usageBean.rowNumber(rowIdx)}" />
                                </p:column>
                                <p:column headerText="Tenant">
                                    <h:outputText value="#{usageBean.tenantName(row.tenantId)}" />
                                </p:column>
                                <p:column headerText="Metrica">
                                    <h:outputText value="#{row.metricName}" />
                                </p:column>
                                <p:column headerText="Valor">
                                    <h:outputText value="#{row.metricValue}" />
                                </p:column>
                                <p:column headerText="Registrado">
                                    <h:outputText value="#{row.recordedAt}" />
                                </p:column>
                            </p:dataTable>
                        </h:form>

                        <h:form id="summaryForm">
                            <p:dataTable id="summaryTable" widgetVar="summaryTableWidget" var="row"
                                value="#{usageBean.summary}" reflow="true" rowIndexVar="rowIdx" paginator="true"
                                rows="10" paginatorPosition="bottom" styleClass="mt-4"
                                emptyMessage="Sin resumen para el rango indicado">
                                <f:facet name="header">
                                    <div class="products-table-header">
                                        <span style="font-weight: bold">Resumen agregado</span>
                                        <span class="text-color-secondary">#{usageBean.summary.size()} lineas</span>
                                    </div>
                                </f:facet>

                                <p:column headerText="Nro." style="width:4rem">
                                    <h:outputText value="#{usageBean.summaryRowNumber(rowIdx)}" />
                                </p:column>
                                <p:column headerText="Tenant">
                                    <h:outputText value="#{row.tenantName}" />
                                </p:column>
                                <p:column headerText="Metrica">
                                    <h:outputText value="#{row.metricName}" />
                                </p:column>
                                <p:column headerText="Total">
                                    <h:outputText value="#{row.total}" />
                                </p:column>
                                <p:column headerText="Muestras">
                                    <h:outputText value="#{row.samples}" />
                                </p:column>
                            </p:dataTable>
                        </h:form>

                        <p:dialog id="usageDialog" widgetVar="usageDialogWidget" header="Registrar consumo"
                            showEffect="fade" modal="true" responsive="true" style="max-width: 94vw">
                            <h:form id="usageForm">
                                <p:outputPanel id="usageFormContent" styleClass="ui-fluid"
                                    style="max-height: 60vh; overflow-y: auto">
                                    <div class="field">
                                        <p:outputLabel for="tenantId" value="Tenant" />
                                        <p:selectOneMenu id="tenantId" value="#{usageBean.tenantId}" required="true"
                                            requiredMessage="Seleccione un tenant" filter="true" styleClass="w-full">
                                            <f:selectItem itemLabel="Seleccione un tenant" itemValue=""
                                                noSelectionOption="true" />
                                            <f:selectItems value="#{usageBean.tenants}" var="tenant"
                                                itemLabel="#{tenant.displayName()}" itemValue="#{tenant.id}" />
                                            <p:ajax listener="#{usageBean.onTenantChange}" update="installationId" />
                                        </p:selectOneMenu>
                                    </div>

                                    <div class="field">
                                        <p:outputLabel for="installationId" value="Instalacion" />
                                        <p:selectOneMenu id="installationId" value="#{usageBean.installationId}"
                                            filter="true" styleClass="w-full">
                                            <f:selectItem itemLabel="Sin instalacion" itemValue=""
                                                noSelectionOption="true" />
                                            <f:selectItems value="#{usageBean.installations}" var="installation"
                                                itemLabel="#{installation.name}" itemValue="#{installation.id}" />
                                        </p:selectOneMenu>
                                    </div>

                                    <div class="formgrid grid">
                                        <div class="field col-12 md:col-7">
                                            <p:outputLabel for="metricName" value="Metrica" />
                                            <p:inputText id="metricName" value="#{usageBean.metricName}" required="true"
                                                requiredMessage="La metrica es obligatoria" styleClass="w-full"
                                                maxlength="60" placeholder="comprobantes_emitidos" />
                                        </div>
                                        <div class="field col-12 md:col-5">
                                            <p:outputLabel for="metricValue" value="Valor" />
                                            <p:inputNumber id="metricValue" value="#{usageBean.metricValue}"
                                                styleClass="w-full" decimalPlaces="2" locale="es" />
                                        </div>
                                    </div>
                                </p:outputPanel>

                                <div class="flex justify-content-between mt-4">
                                    <p:commandButton id="saveButton" value="Guardar" icon="pi pi-check" process="@form"
                                        update="@form :listForm :summaryForm :messages" action="#{usageBean.save}" />
                                    <p:commandButton id="cancelButton" value="Cancelar" icon="pi pi-times" type="button"
                                        styleClass="ui-button-secondary" onclick="PF('usageDialogWidget').hide()" />
                                </div>
                            </h:form>
                        </p:dialog>
                    </div>
                </div>
            </div>
        </div>
    </ui:define>

</ui:composition>
