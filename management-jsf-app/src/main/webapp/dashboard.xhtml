<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core" xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:p="http://primefaces.org/ui" template="/WEB-INF/template/template.xhtml">

    <ui:define name="title">MindalAI Platform Management - Dashboard</ui:define>

    <ui:define name="viewname">
        <li>Pages</li>
        <li>/</li>
        <li>
            <p:link outcome="/dashboard">Dashboard</p:link>
        </li>
    </ui:define>

    <ui:define name="content">
        <p:messages autoUpdate="true" />

        <div class="grid">
            <div class="col-12">
                <div class="card">
                    <h4>Tenants</h4>
                    <p>CorrelationId: #{dashboardBean.correlationId}</p>
                    <p>Tenants: #{dashboardBean.tenantCount}</p>
                    <h:form>
                        <p:commandButton action="#{loginBean.logout}" value="Logout" ajax="false"
                            icon="pi pi-sign-out" style="margin-top:6px" />
                    </h:form>
                </div>
            </div>
        </div>

        <div class="grid">
            <div class="col-12">
                <div class="card">
                    <h4>Listado de Tenants</h4>
                    <p:dataTable value="#{dashboardBean.tenants}" var="t" paginator="true" rows="10"
                        emptyMessage="Sin tenants (backend no conectado)">
                        <p:column headerText="Razón Social">
                            <h:outputText value="#{t.legalName}" />
                        </p:column>
                        <p:column headerText="RUC">
                            <h:outputText value="#{t.ruc}" />
                        </p:column>
                        <p:column headerText="Estado">
                            <h:outputText value="#{t.status}" />
                        </p:column>
                    </p:dataTable>
                </div>
            </div>
        </div>

        <div class="grid">
            <div class="col-12">
                <div class="card">
                    <h4>Crear Tenant</h4>
                    <h:form>
                        <div class="grid formgrid">
                            <div class="col-12 md:col-6">
                                <p:outputLabel for="legalName" value="Razón Social" />
                                <p:inputText id="legalName" value="#{tenantBean.legalName}" required="true" />
                            </div>
                            <div class="col-12 md:col-6">
                                <p:outputLabel for="ruc" value="RUC" />
                                <p:inputText id="ruc" value="#{tenantBean.ruc}" required="true" />
                            </div>
                            <div class="col-12 md:col-6">
                                <p:outputLabel for="tradeName" value="Nombre Comercial" />
                                <p:inputText id="tradeName" value="#{tenantBean.tradeName}" />
                            </div>
                        </div>
                        <p:commandButton value="Crear" action="#{tenantBean.create}" update="@form"
                            icon="pi pi-check" style="margin-top:1rem;" />
                        <p:commandButton value="Recargar" action="#{tenantBean.load}" update="@form"
                            icon="pi pi-refresh" style="margin-left:0.5rem;" />
                    </h:form>
                </div>
            </div>
        </div>
    </ui:define>

</ui:composition>
