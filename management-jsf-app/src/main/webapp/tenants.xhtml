<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets" xmlns:p="http://primefaces.org/ui" template="/WEB-INF/template/template.xhtml">
    <f:metadata>
        <f:viewAction action="#{tenantBean.load}" onPostBack="false" />
    </f:metadata>

    <ui:define name="title">Tenants - MINDALAI Platform Management</ui:define>
    <ui:define name="viewname">Tenants</ui:define>

    <ui:define name="content">

        <p:growl id="messages" showDetail="false" life="7000" />

        <div class="grid crud-demo">
            <div class="col-12">
                <h1 class="text-3xl font-medium">Tenants</h1>
                <p class="text-color-secondary">Empresas cliente de la plataforma</p>
            </div>

            <div class="col-12">
                <div class="card">
                    <div class="card-content">
                        <h:form id="filterForm">
                            <div class="formgrid grid">
                                <div class="field col-12 md:col-4">
                                    <p:outputLabel for="statusFilter" value="Estado" />
                                    <p:selectOneMenu id="statusFilter" value="#{tenantBean.statusFilter}"
                                        styleClass="w-full">
                                        <f:selectItem itemLabel="Todos" itemValue="" noSelectionOption="true" />
                                        <f:selectItems value="#{tenantBean.statuses}" var="status" itemLabel="#{status}"
                                            itemValue="#{status}" />
                                    </p:selectOneMenu>
                                </div>
                                <div class="field col-12 md:col-6">
                                    <p:outputLabel for="search" value="Buscar" />
                                    <p:inputText id="search" value="#{tenantBean.search}" styleClass="w-full"
                                        placeholder="RUC, razon social o correo" />
                                </div>
                                <div class="field col-12 md:col-2 flex align-items-end">
                                    <p:commandButton id="filterButton" value="Filtrar" icon="pi pi-filter"
                                        update=":filterForm :listForm :messages" process="@form"
                                        action="#{tenantBean.load}" styleClass="w-full" />
                                </div>
                            </div>
                        </h:form>

                        <h:form id="listForm">
                            <p:toolbar styleClass="mb-4">
                                <p:toolbarGroup>
                                    <p:commandButton id="newButton" value="Nuevo tenant" icon="pi pi-plus"
                                        styleClass="ui-button-success" process="@this" update=":tenantDialog :messages"
                                        action="#{tenantBean.openNew}" oncomplete="PF('tenantDialogWidget').show()" />
                                </p:toolbarGroup>
                                <p:toolbarGroup align="right">
                                    <p:commandButton id="exportPdf" value="PDF" icon="pi pi-file-pdf" process="@this"
                                        update="@none" styleClass="ml-1 ui-button-danger">
                                        <p:dataExporter type="pdf" target="tenantsTable" fileName="tenants" />
                                    </p:commandButton>
                                    <p:commandButton id="exportExcel" value="Excel" icon="pi pi-file-excel"
                                        process="@this" update="@none" styleClass="ml-1 ui-button-success">
                                        <p:dataExporter type="xlsx" target="tenantsTable" fileName="tenants" />
                                    </p:commandButton>
                                    <p:commandButton id="exportCsv" value="CSV" icon="pi pi-table" process="@this"
                                        update="@none" styleClass="ml-1 ui-button-info">
                                        <p:dataExporter type="csv" target="tenantsTable" fileName="tenants" />
                                    </p:commandButton>
                                </p:toolbarGroup>
                            </p:toolbar>

                            <p:dataTable id="tenantsTable" widgetVar="tenantsTableWidget" var="tenant"
                                value="#{tenantBean.tenants}" rowKey="#{tenant.id}" reflow="true" rowIndexVar="rowIdx"
                                paginator="true" rows="10" paginatorPosition="bottom"
                                emptyMessage="No hay tenants que coincidan con el filtro">
                                <f:facet name="header">
                                    <div class="products-table-header">
                                        <span style="font-weight: bold">Gestionar Tenants</span>
                                        <span class="text-color-secondary">#{tenantBean.tenants.size()} tenants
                                            listados</span>
                                    </div>
                                </f:facet>

                                <p:column headerText="Nro." style="width:4rem">
                                    <h:outputText value="#{tenantBean.rowNumber(rowIdx)}" />
                                </p:column>
                                <p:column headerText="RUC">
                                    <h:outputText value="#{tenant.ruc}" />
                                </p:column>
                                <p:column headerText="Razon social">
                                    <h:outputText value="#{tenant.legalName}" />
                                </p:column>
                                <p:column headerText="Comercial">
                                    <h:outputText value="#{tenant.tradeName}" />
                                </p:column>
                                <p:column headerText="Correo">
                                    <h:outputText value="#{tenant.email}" />
                                </p:column>
                                <p:column headerText="Estado" exportableValue="#{tenant.status}">
                                    <p:tag value="#{tenant.status}"
                                        severity="#{tenantBean.statusSeverity(tenant.status)}" />
                                </p:column>
                                <p:column headerText="Acciones" exportable="false" style="width:12rem">
                                    <p:commandButton id="editButton" icon="pi pi-pencil" title="Editar"
                                        styleClass="rounded-button ui-button-secondary" process="@this"
                                        update=":tenantDialog :messages" action="#{tenantBean.edit(tenant)}"
                                        oncomplete="PF('tenantDialogWidget').show()">
                                        <f:param name="tenant" value="#{tenant}" />
                                    </p:commandButton>
                                    <p:commandButton id="suspendButton" icon="pi pi-pause" title="Suspender"
                                        styleClass="ml-1 rounded-button ui-button-warning" process="@this"
                                        update=":statusDialog :messages" rendered="#{tenant.status == 'ACTIVE'}"
                                        action="#{tenantBean.requestSuspend(tenant)}"
                                        oncomplete="PF('statusDialogWidget').show()">
                                        <f:param name="tenant" value="#{tenant}" />
                                    </p:commandButton>
                                    <p:commandButton id="reactivateButton" icon="pi pi-play" title="Reactivar"
                                        styleClass="ml-1 rounded-button ui-button-success" process="@this"
                                        update=":statusDialog :messages" rendered="#{tenant.status == 'SUSPENDED'}"
                                        action="#{tenantBean.requestReactivate(tenant)}"
                                        oncomplete="PF('statusDialogWidget').show()">
                                        <f:param name="tenant" value="#{tenant}" />
                                    </p:commandButton>
                                    <p:commandButton id="historyButton" icon="pi pi-history"
                                        title="Historial de estados" styleClass="ml-1 rounded-button ui-button-info"
                                        process="@this" update=":historyDialog :messages"
                                        action="#{tenantBean.openHistory(tenant)}"
                                        oncomplete="PF('historyDialogWidget').show()">
                                        <f:param name="tenant" value="#{tenant}" />
                                    </p:commandButton>
                                </p:column>
                            </p:dataTable>
                        </h:form>

                        <p:dialog id="tenantDialog" widgetVar="tenantDialogWidget"
                            header="#{tenantBean.editing ? 'Editar tenant' : 'Nuevo tenant'}" showEffect="fade"
                            modal="true" responsive="true" style="max-width: 94vw">
                            <h:form id="tenantForm">
                                <p:outputPanel id="tenantFormContent" styleClass="ui-fluid"
                                    style="max-height: 60vh; overflow-y: auto">
                                    <div class="field">
                                        <p:outputLabel for="legalName" value="Razon social" />
                                        <p:inputText id="legalName" value="#{tenantBean.legalName}" required="true"
                                            requiredMessage="La razon social es obligatoria" styleClass="w-full" />
                                    </div>

                                    <div class="field">
                                        <p:outputLabel for="ruc" value="RUC (13 digitos)" />
                                        <p:inputText id="ruc" value="#{tenantBean.ruc}" required="true"
                                            requiredMessage="El RUC es obligatorio" styleClass="w-full" maxlength="13"
                                            disabled="#{tenantBean.editing}" />
                                        <small class="text-color-secondary" rendered="#{tenantBean.editing}">El RUC no
                                            se puede modificar.</small>
                                    </div>

                                    <div class="field">
                                        <p:outputLabel for="tradeName" value="Nombre comercial" />
                                        <p:inputText id="tradeName" value="#{tenantBean.tradeName}"
                                            styleClass="w-full" />
                                    </div>

                                    <div class="field">
                                        <p:outputLabel for="email" value="Correo" />
                                        <p:inputText id="email" value="#{tenantBean.email}" styleClass="w-full" />
                                    </div>

                                    <div class="field">
                                        <p:outputLabel for="phone" value="Telefono" />
                                        <p:inputText id="phone" value="#{tenantBean.phone}" styleClass="w-full" />
                                    </div>
                                </p:outputPanel>

                                <div class="flex justify-content-between mt-4">
                                    <p:commandButton id="saveButton" value="Guardar" icon="pi pi-check" process="@form"
                                        update="@form :listForm :messages" action="#{tenantBean.save}" />
                                    <p:commandButton id="cancelButton" value="Cancelar" icon="pi pi-times" type="button"
                                        styleClass="ui-button-secondary" onclick="PF('tenantDialogWidget').hide()" />
                                </div>
                            </h:form>
                        </p:dialog>

                        <p:dialog id="statusDialog" widgetVar="statusDialogWidget"
                            header="#{tenantBean.statusAction == 'REACTIVATE' ? 'Reactivar tenant' : 'Suspender tenant'}"
                            showEffect="fade" modal="true" responsive="true" style="max-width: 94vw">
                            <h:form id="statusForm">
                                <p:outputPanel id="statusFormContent" styleClass="ui-fluid"
                                    style="max-height: 60vh; overflow-y: auto">
                                    <div class="field">
                                        <p:outputLabel for="statusRuc" value="RUC" />
                                        <h:outputText id="statusRuc" value="#{tenantBean.selectedTenant.ruc}"
                                            styleClass="w-full surface-100 p-2 border-round" />
                                    </div>

                                    <div class="field">
                                        <p:outputLabel for="statusLegalName" value="Razon social" />
                                        <h:outputText id="statusLegalName"
                                            value="#{tenantBean.selectedTenant.legalName}"
                                            styleClass="w-full surface-100 p-2 border-round" />
                                    </div>

                                    <div class="field">
                                        <p:outputLabel for="statusReason" value="Motivo" />
                                        <p:inputTextarea id="statusReason" value="#{tenantBean.statusReason}" rows="3"
                                            required="true" styleClass="w-full"
                                            requiredMessage="El motivo es obligatorio"
                                            placeholder="Explique por que se cambia el estado del tenant" />
                                    </div>
                                </p:outputPanel>

                                <div class="flex justify-content-between mt-4">
                                    <p:commandButton id="confirmButton" value="Confirmar" icon="pi pi-check"
                                        process="@form" update="@form :historyDialog :listForm :messages"
                                        action="#{tenantBean.confirmStatusChange}" />
                                    <p:commandButton id="cancelStatusButton" value="Cancelar" icon="pi pi-times"
                                        type="button" styleClass="ui-button-secondary"
                                        onclick="PF('statusDialogWidget').hide()" />
                                </div>
                            </h:form>
                        </p:dialog>

                        <p:dialog id="historyDialog" widgetVar="historyDialogWidget" header="Historial de estados"
                            width="46rem" showEffect="fade" modal="true" responsive="true" style="max-width: 94vw">
                            <h:form id="historyForm">
                                <p:outputPanel id="historyFormContent" styleClass="ui-fluid"
                                    style="max-height: 60vh; overflow-y: auto">
                                    <div class="field">
                                        <p:outputLabel for="historyRuc" value="RUC" />
                                        <h:outputText id="historyRuc" value="#{tenantBean.selectedTenant.ruc}"
                                            styleClass="w-full surface-100 p-2 border-round" />
                                    </div>

                                    <div class="field">
                                        <p:outputLabel for="historyLegalName" value="Razon social" />
                                        <h:outputText id="historyLegalName"
                                            value="#{tenantBean.selectedTenant.legalName}"
                                            styleClass="w-full surface-100 p-2 border-round" />
                                    </div>

                                    <p:dataTable id="historyTable" var="entry" value="#{tenantBean.selectedHistory}"
                                        reflow="true" emptyMessage="Sin cambios de estado registrados"
                                        styleClass="mt-3">
                                        <p:column headerText="Transicion">
                                            <h:outputText value="#{entry.transition()}" />
                                        </p:column>
                                        <p:column headerText="Motivo">
                                            <h:outputText value="#{entry.reason}" />
                                        </p:column>
                                        <p:column headerText="Fecha y hora">
                                            <h:outputText value="#{entry.changedAtText()}" />
                                        </p:column>
                                        <p:column headerText="Usuario">
                                            <h:outputText value="#{entry.username}" />
                                        </p:column>
                                    </p:dataTable>
                                </p:outputPanel>

                                <div class="flex justify-content-end mt-4">
                                    <p:commandButton id="closeHistoryButton" value="Cerrar" icon="pi pi-times"
                                        type="button" styleClass="ui-button-secondary"
                                        onclick="PF('historyDialogWidget').hide()" />
                                </div>
                            </h:form>
                        </p:dialog>
                    </div>
                </div>
            </div>
        </div>
    </ui:define>

</ui:composition>
