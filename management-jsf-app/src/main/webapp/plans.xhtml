<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets" xmlns:p="http://primefaces.org/ui" template="/WEB-INF/template/template.xhtml">
    <f:metadata>
        <f:viewAction action="#{planBean.load}" onPostBack="false" />
    </f:metadata>

    <ui:define name="title">Planes - MINDALAI Platform Management</ui:define>
    <ui:define name="viewname">Plans</ui:define>

    <ui:define name="content">

        <p:growl id="messages" showDetail="false" life="7000" />

        <div class="grid crud-demo">
            <div class="col-12">
                <h1 class="text-3xl font-medium">Planes</h1>
                <p class="text-color-secondary">Catalogo comercial con limites y features por plan</p>
            </div>

            <div class="col-12">
                <div class="card">
                    <div class="card-content">
                        <h:form id="listForm">
                            <p:toolbar styleClass="mb-4">
                                <p:toolbarGroup>
                                    <p:commandButton id="newButton" value="Nuevo plan" icon="pi pi-plus"
                                        styleClass="ui-button-success" process="@this" update=":planDialog :messages"
                                        action="#{planBean.openNew}" oncomplete="PF('planDialogWidget').show()" />
                                </p:toolbarGroup>
                                <p:toolbarGroup align="right">
                                    <p:commandButton id="exportPdf" value="PDF" icon="pi pi-file-pdf" process="@this"
                                        update="@none" styleClass="ml-1 ui-button-danger">
                                        <p:dataExporter type="pdf" target="plansTable" fileName="plans" />
                                    </p:commandButton>
                                    <p:commandButton id="exportExcel" value="Excel" icon="pi pi-file-excel"
                                        process="@this" update="@none" styleClass="ml-1 ui-button-success">
                                        <p:dataExporter type="xlsx" target="plansTable" fileName="plans" />
                                    </p:commandButton>
                                    <p:commandButton id="exportCsv" value="CSV" icon="pi pi-table" process="@this"
                                        update="@none" styleClass="ml-1 ui-button-info">
                                        <p:dataExporter type="csv" target="plansTable" fileName="plans" />
                                    </p:commandButton>
                                </p:toolbarGroup>
                            </p:toolbar>

                            <p:dataTable id="plansTable" widgetVar="plansTableWidget" var="plan"
                                value="#{planBean.plans}" rowKey="#{plan.id}" reflow="true" rowIndexVar="rowIdx"
                                paginator="true" rows="10" paginatorPosition="bottom"
                                emptyMessage="No hay planes registrados">
                                <f:facet name="header">
                                    <div class="products-table-header">
                                        <span style="font-weight: bold">Gestionar Planes</span>
                                        <span class="text-color-secondary">#{planBean.plans.size()} planes
                                            listados</span>
                                    </div>
                                </f:facet>

                                <p:column headerText="Nro." style="width:4rem">
                                    <h:outputText value="#{planBean.rowNumber(rowIdx)}" />
                                </p:column>
                                <p:column headerText="Codigo">
                                    <h:outputText value="#{plan.code}" />
                                </p:column>
                                <p:column headerText="Nombre">
                                    <h:outputText value="#{plan.name}" />
                                </p:column>
                                <p:column headerText="Precio mensual">
                                    <h:outputText value="#{plan.monthlyPrice}" />
                                </p:column>
                                <p:column headerText="Usuarios">
                                    <h:outputText value="#{plan.maxUsers}" />
                                </p:column>
                                <p:column headerText="Dispositivos">
                                    <h:outputText value="#{plan.maxDevices}" />
                                </p:column>
                                <p:column headerText="Instalaciones">
                                    <h:outputText value="#{plan.maxInstallations}" />
                                </p:column>
                                <p:column headerText="Features" exportableValue="#{plan.features.size()}">
                                    <h:outputText value="#{plan.features.size()}" />
                                </p:column>
                                <p:column headerText="Estado" exportableValue="#{plan.active}">
                                    <p:tag value="#{plan.active ? 'ACTIVO' : 'INACTIVO'}"
                                        severity="#{planBean.statusSeverity(plan.active ? 'ACTIVE' : 'INACTIVE')}" />
                                </p:column>
                                <p:column headerText="Acciones" exportable="false" style="width:10rem">
                                    <p:commandButton id="editButton" icon="pi pi-pencil" title="Editar"
                                        styleClass="rounded-button ui-button-secondary" process="@this"
                                        update=":planDialog :messages" action="#{planBean.edit(plan)}"
                                        oncomplete="PF('planDialogWidget').show()">
                                        <f:param name="plan" value="#{plan}" />
                                    </p:commandButton>
                                    <p:commandButton id="activateButton" icon="pi pi-play" title="Activar"
                                        styleClass="ml-1 rounded-button ui-button-success" process="@this"
                                        update=":messages :listForm" rendered="#{not plan.active}"
                                        action="#{planBean.activate(plan)}">
                                        <f:param name="plan" value="#{plan}" />
                                    </p:commandButton>
                                    <p:commandButton id="deactivateButton" icon="pi pi-pause" title="Desactivar"
                                        styleClass="ml-1 rounded-button ui-button-warning" process="@this"
                                        update=":messages :listForm" rendered="#{plan.active}"
                                        action="#{planBean.deactivate(plan)}">
                                        <f:param name="plan" value="#{plan}" />
                                    </p:commandButton>
                                </p:column>
                            </p:dataTable>
                        </h:form>

                        <p:dialog id="planDialog" widgetVar="planDialogWidget"
                            header="#{planBean.editing ? 'Editar plan' : 'Nuevo plan'}" showEffect="fade" modal="true"
                            responsive="true" style="max-width: 94vw">
                            <h:form id="planForm">
                                <p:outputPanel id="planFormContent" styleClass="ui-fluid"
                                    style="max-height: 60vh; overflow-y: auto">
                                    <div class="field">
                                        <p:outputLabel for="code" value="Codigo" />
                                        <p:inputText id="code" value="#{planBean.code}" required="true"
                                            requiredMessage="El codigo es obligatorio" styleClass="w-full"
                                            maxlength="50" disabled="#{planBean.editing}" />
                                        <small class="text-color-secondary" rendered="#{planBean.editing}">El codigo
                                            no se puede modificar.</small>
                                    </div>

                                    <div class="field">
                                        <p:outputLabel for="name" value="Nombre" />
                                        <p:inputText id="name" value="#{planBean.name}" required="true"
                                            requiredMessage="El nombre es obligatorio" styleClass="w-full"
                                            maxlength="100" />
                                    </div>

                                    <div class="field">
                                        <p:outputLabel for="description" value="Descripcion" />
                                        <p:inputTextarea id="description" value="#{planBean.description}" rows="2"
                                            maxlength="300" styleClass="w-full" />
                                    </div>

                                    <div class="formgrid grid">
                                        <div class="field col-12 md:col-6">
                                            <p:outputLabel for="monthlyPrice" value="Precio mensual" />
                                            <p:inputNumber id="monthlyPrice" value="#{planBean.monthlyPrice}"
                                                styleClass="w-full" decimalPlaces="2" minFractionDigits="2"
                                                locale="es" />
                                        </div>
                                        <div class="field col-12 md:col-6">
                                            <p:outputLabel for="maxUsers" value="Usuarios" />
                                            <p:inputNumber id="maxUsers" value="#{planBean.maxUsers}"
                                                styleClass="w-full" minValue="0" />
                                        </div>
                                        <div class="field col-12 md:col-6">
                                            <p:outputLabel for="maxDevices" value="Dispositivos" />
                                            <p:inputNumber id="maxDevices" value="#{planBean.maxDevices}"
                                                styleClass="w-full" minValue="0" />
                                        </div>
                                        <div class="field col-12 md:col-6">
                                            <p:outputLabel for="maxInstallations" value="Instalaciones" />
                                            <p:inputNumber id="maxInstallations" value="#{planBean.maxInstallations}"
                                                styleClass="w-full" minValue="0" placeholder="Sin limite" />
                                        </div>
                                        <div class="field col-12 md:col-6">
                                            <p:outputLabel for="maxDocuments" value="Comprobantes por mes" />
                                            <p:inputNumber id="maxDocuments" value="#{planBean.maxDocumentsPerMonth}"
                                                styleClass="w-full" minValue="0" placeholder="Sin limite" />
                                        </div>
                                    </div>

                                    <div class="field mt-3">
                                        <p:outputLabel for="featureBoxes" value="Features del plan" />
                                        <p:outputPanel id="featureBoxes" styleClass="surface-100 p-3 border-round"
                                            style="max-height: 16rem; overflow-y: auto">
                                            <div class="formgrid grid">
                                                <ui:repeat value="#{planBean.featureOptions}" var="option">
                                                    <div class="field col-12 md:col-6">
                                                        <p:selectBooleanCheckbox itemLabel="#{option.label()}"
                                                            value="#{option.selected}" />
                                                    </div>
                                                </ui:repeat>
                                            </div>
                                            <h:outputText id="noFeatures" styleClass="text-color-secondary"
                                                rendered="#{empty planBean.featureOptions}"
                                                value="No hay features en el catalogo" />
                                        </p:outputPanel>
                                        <small class="text-color-secondary">
                                            #{planBean.featureOptions.size()} features disponibles. Un plan debe
                                            incluir al menos una feature.</small>
                                    </div>
                                </p:outputPanel>

                                <div class="flex justify-content-between mt-4">
                                    <p:commandButton id="saveButton" value="Guardar" icon="pi pi-check" process="@form"
                                        update="@form :listForm :messages" action="#{planBean.save}" />
                                    <p:commandButton id="cancelButton" value="Cancelar" icon="pi pi-times" type="button"
                                        styleClass="ui-button-secondary" onclick="PF('planDialogWidget').hide()" />
                                </div>
                            </h:form>
                        </p:dialog>
                    </div>
                </div>
            </div>
        </div>
    </ui:define>

</ui:composition>
