<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets" xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template/template.xhtml">
    <f:metadata>
        <f:viewAction action="#{subscriptionBean.load}" onPostBack="false" />
    </f:metadata>

    <ui:define name="title">Suscripciones - MINDALAI Platform Management</ui:define>
    <ui:define name="viewname">Suscripciones</ui:define>

    <ui:define name="content">

        <div class="grid">
            <div class="col-12">
                <h1 class="text-3xl font-medium">Suscripciones</h1>
                <p class="text-color-secondary">Vigencia comercial de cada tenant</p>
            </div>

            <div class="col-12 lg:col-4">
                <div class="card">
                    <div class="card-content">
                        <h2 class="text-xl font-semibold mb-3">Nueva suscripcion</h2>
                        <h:form id="subscriptionForm">
                            <p:messages id="formMessages" showDetail="true" closable="true" />
                            <div class="field">
                                <p:outputLabel for="tenantId" value="Tenant *" />
                                <p:selectOneMenu id="tenantId" value="#{subscriptionBean.tenantId}" required="true"
                                                 requiredMessage="Seleccione un tenant" filter="true"
                                                 styleClass="w-full">
                                    <f:selectItem itemLabel="Seleccione un tenant" itemValue=""
                                                  noSelectionOption="true" />
                                    <f:selectItems value="#{subscriptionBean.tenants}" var="tenant"
                                                   itemLabel="#{tenant.displayName()} - #{tenant.ruc}"
                                                   itemValue="#{tenant.id}" />
                                </p:selectOneMenu>
                            </div>

                            <div class="field">
                                <p:outputLabel for="planId" value="Plan *" />
                                <p:selectOneMenu id="planId" value="#{subscriptionBean.planId}" required="true"
                                                 requiredMessage="Seleccione un plan" styleClass="w-full">
                                    <f:selectItem itemLabel="Seleccione un plan" itemValue=""
                                                  noSelectionOption="true" />
                                    <f:selectItems value="#{subscriptionBean.plans}" var="plan"
                                                   itemLabel="#{plan.code} - #{plan.name}"
                                                   itemValue="#{plan.id}" />
                                </p:selectOneMenu>
                            </div>

                            <div class="formgrid grid">
                                <div class="field col-6">
                                    <p:outputLabel for="validFrom" value="Vigencia desde" />
                                    <p:datePicker id="validFrom" value="#{subscriptionBean.validFrom}"
                                                  dateFormat="dd/MM/yyyy" showIcon="true" styleClass="w-full" />
                                </div>
                                <div class="field col-6">
                                    <p:outputLabel for="validUntil" value="Vigencia hasta" />
                                    <p:datePicker id="validUntil" value="#{subscriptionBean.validUntil}"
                                                  dateFormat="dd/MM/yyyy" showIcon="true" styleClass="w-full" />
                                </div>
                            </div>

                            <div class="field">
                                <p:outputLabel for="notes" value="Notas" />
                                <p:inputTextarea id="notes" value="#{subscriptionBean.notes}" rows="3"
                                                 styleClass="w-full" />
                            </div>

                            <p:commandButton id="createButton" value="Crear suscripcion" icon="pi pi-plus"
                                             update="@form" process="@form"
                                             action="#{subscriptionBean.create}" styleClass="mt-3" />
                        </h:form>
                    </div>
                </div>
            </div>

            <div class="col-12 lg:col-8">
                <div class="card">
                    <div class="card-content">
                        <h:form id="filterForm">
                            <p:messages id="formMessages" showDetail="true" closable="true" />
                            <div class="formgrid grid">
                                <div class="field col-12 md:col-8">
                                    <p:outputLabel for="tenantFilter" value="Filtrar por tenant" />
                                    <p:selectOneMenu id="tenantFilter" value="#{subscriptionBean.tenantFilter}"
                                                     filter="true" styleClass="w-full">
                                        <f:selectItem itemLabel="Todos los tenants" itemValue=""
                                                      noSelectionOption="true" />
                                        <f:selectItems value="#{subscriptionBean.tenants}" var="filterTenant"
                                                       itemLabel="#{filterTenant.displayName()}"
                                                       itemValue="#{filterTenant.id}" />
                                    </p:selectOneMenu>
                                </div>
                                <div class="field col-12 md:col-4 flex align-items-end">
                                    <p:commandButton id="filterButton" value="Filtrar" icon="pi pi-filter"
                                                     update="@form" process="@form"
                                                     action="#{subscriptionBean.filterByTenant}" styleClass="w-full" />
                                </div>
                            </div>
                        </h:form>

                        <h:form id="listForm">
                            <p:messages id="formMessages" showDetail="true" closable="true" />
                            <p:dataTable id="subscriptionsTable" value="#{subscriptionBean.subscriptions}"
                                         var="subscription" paginator="true" rows="10"
                                         emptyMessage="No hay suscripciones registradas">
                                <p:column headerText="Tenant">
                                    <h:outputText value="#{subscription.tenantName}" />
                                </p:column>
                                <p:column headerText="Plan">
                                    <h:outputText value="#{subscription.planCode}" />
                                </p:column>
                                <p:column headerText="Estado">
                                    <p:tag value="#{subscription.status}" severity="info" />
                                </p:column>
                                <p:column headerText="Desde">
                                    <h:outputText value="#{subscription.validFrom}" />
                                </p:column>
                                <p:column headerText="Hasta">
                                    <h:outputText value="#{subscription.validUntil}" />
                                </p:column>
                                <p:column headerText="Acciones" style="width:16rem">
                                    <p:commandButton id="suspendButton" icon="pi pi-pause" title="Suspender"
                                                     update="@form" process="@this"
                                                     rendered="#{subscription.status == 'ACTIVE'}"
                                                     action="#{subscriptionBean.suspend(subscription)}">
                                        <f:param name="subscription" value="#{subscription}" />
                                    </p:commandButton>
                                    <p:commandButton id="renewButton" icon="pi pi-calendar-plus" title="Renovar"
                                                     update="@form" process="@this" styleClass="ml-1"
                                                     action="#{subscriptionBean.prepareRenew(subscription)}">
                                        <f:param name="subscription" value="#{subscription}" />
                                    </p:commandButton>
                                    <p:commandButton id="cancelButton" icon="pi pi-times" title="Cancelar"
                                                     update="@form" process="@this" styleClass="ml-1"
                                                     rendered="#{subscription.status != 'CANCELLED'}"
                                                     action="#{subscriptionBean.cancel(subscription)}">
                                        <f:param name="subscription" value="#{subscription}" />
                                    </p:commandButton>
                                </p:column>
                            </p:dataTable>
                        </h:form>

                        <h:panelGroup id="renewPanel" layout="block"
                                      rendered="#{subscriptionBean.renewingId != null}"
                                      styleClass="card mt-3">
                            <h:form id="renewForm">
                                <p:messages id="formMessages" showDetail="true" closable="true" />
                                <div class="card-content">
                                    <h3 class="text-lg font-medium">Renovar suscripcion</h3>
                                    <div class="formgrid grid">
                                        <div class="field col-12 md:col-4">
                                            <p:outputLabel for="renewUntil" value="Nueva vigencia hasta *" />
                                            <p:datePicker id="renewUntil" value="#{subscriptionBean.renewUntil}"
                                                          dateFormat="dd/MM/yyyy" showIcon="true"
                                                          styleClass="w-full" />
                                        </div>
                                        <div class="field col-12 md:col-8 flex align-items-end">
                                            <p:commandButton id="confirmRenewButton" value="Confirmar renovacion"
                                                             icon="pi pi-check" update="@form" process="@form"
                                                             action="#{subscriptionBean.renew}" />
                                            <p:commandButton id="cancelRenewButton" value="Cancelar"
                                                             severity="secondary" icon="pi pi-times"
                                                             update="@form" process="@form" styleClass="ml-2"
                                                             action="#{subscriptionBean.cancelRenew}" />
                                        </div>
                                    </div>
                                </div>
                            </h:form>
                        </h:panelGroup>
                    </div>
                </div>
            </div>
        </div>
    </ui:define>

</ui:composition>
