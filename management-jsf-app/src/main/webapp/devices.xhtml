<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets" xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template/template.xhtml">
    <f:metadata>
        <f:viewAction action="#{deviceBean.load}" onPostBack="false" />
    </f:metadata>

    <ui:define name="title">Dispositivos - MINDALAI Platform Management</ui:define>
    <ui:define name="viewname">Dispositivos</ui:define>

    <ui:define name="content">

        <p:messages id="globalMessages" showSummary="false" showDetail="true" closable="true" />

        <div class="grid">
            <div class="col-12">
                <h1 class="text-3xl font-medium">Dispositivos</h1>
                <p class="text-color-secondary">Servidores y cajas por instalacion</p>
            </div>

            <div class="col-12 lg:col-4">
                <div class="card">
                    <div class="card-content">
                        <h2 class="text-xl font-semibold mb-3">Registrar dispositivo</h2>
                        <h:form id="deviceForm">
                            <div class="field">
                                <p:outputLabel for="installationId" value="Instalacion *" />
                                <p:selectOneMenu id="installationId" value="#{deviceBean.installationId}"
                                                 required="true" requiredMessage="Seleccione una instalacion"
                                                 filter="true" styleClass="w-full">
                                    <f:selectItem itemLabel="Seleccione una instalacion" itemValue=""
                                                  noSelectionOption="true" />
                                    <f:selectItems value="#{deviceBean.activeInstallations()}" var="installation"
                                                   itemLabel="#{installation.tenantName} - #{installation.name}"
                                                   itemValue="#{installation.id}" />
                                </p:selectOneMenu>
                            </div>

                            <div class="field">
                                <p:outputLabel for="deviceType" value="Tipo *" />
                                <p:selectOneMenu id="deviceType" value="#{deviceBean.deviceType}" required="true"
                                                 styleClass="w-full">
                                    <f:selectItems value="#{deviceBean.deviceTypes()}" var="type"
                                                   itemLabel="#{type}" itemValue="#{type}" />
                                </p:selectOneMenu>
                            </div>

                            <div class="field">
                                <p:outputLabel for="identifier" value="Identificador *" />
                                <p:inputText id="identifier" value="#{deviceBean.identifier}" required="true"
                                             requiredMessage="El identificador es obligatorio" styleClass="w-full" />
                            </div>

                            <div class="field">
                                <p:outputLabel for="name" value="Nombre" />
                                <p:inputText id="name" value="#{deviceBean.name}" styleClass="w-full" />
                            </div>

                            <p:commandButton id="registerButton" value="Registrar" icon="pi pi-plus"
                                             update=":deviceForm :listForm :globalMessages" process="@form" action="#{deviceBean.register}"
                                             styleClass="mt-3" />
                        </h:form>
                    </div>
                </div>
            </div>

            <div class="col-12 lg:col-8">
                <div class="card">
                    <div class="card-content">
                        <h:form id="filterForm">
                            <div class="formgrid grid">
                                <div class="field col-12 md:col-8">
                                    <p:outputLabel for="installationFilter" value="Filtrar por instalacion" />
                                    <p:selectOneMenu id="installationFilter" value="#{deviceBean.installationFilter}"
                                                     filter="true" styleClass="w-full">
                                        <f:selectItem itemLabel="Todas las instalaciones" itemValue=""
                                                      noSelectionOption="true" />
                                        <f:selectItems value="#{deviceBean.activeInstallations()}" var="filterInstallation"
                                                       itemLabel="#{filterInstallation.tenantName} - #{filterInstallation.name}"
                                                       itemValue="#{filterInstallation.id}" />
                                    </p:selectOneMenu>
                                </div>
                                <div class="field col-12 md:col-4 flex align-items-end">
                                    <p:commandButton id="filterButton" value="Filtrar" icon="pi pi-filter"
                                                     update=":filterForm :listForm :globalMessages" process="@form" action="#{deviceBean.load}"
                                                     styleClass="w-full" />
                                </div>
                            </div>
                        </h:form>

                        <h:form id="listForm">
                            <p:dataTable id="devicesTable" value="#{deviceBean.devices}" var="device"
                                         paginator="true" rows="10" emptyMessage="No hay dispositivos registrados">
                                <p:column headerText="Identificador">
                                    <h:outputText value="#{device.identifier}" />
                                </p:column>
                                <p:column headerText="Nombre">
                                    <h:outputText value="#{device.name}" />
                                </p:column>
                                <p:column headerText="Tipo">
                                    <h:outputText value="#{device.deviceType}" />
                                </p:column>
                                <p:column headerText="Instalacion">
                                    <h:outputText value="#{device.installationName}" />
                                </p:column>
                                <p:column headerText="Estado">
                                    <p:tag value="#{device.status}" severity="info" />
                                </p:column>
                                <p:column headerText="Ultimo contacto">
                                    <h:outputText value="#{device.lastSeenAt}" />
                                </p:column>
                                <p:column headerText="Acciones" style="width:14rem">
                                    <p:commandButton id="heartbeatButton" icon="pi pi-send" title="Heartbeat"
                                                     update=":listForm :globalMessages" process="@this"
                                                     action="#{deviceBean.heartbeat(device)}">
                                        <f:param name="device" value="#{device}" />
                                    </p:commandButton>
                                    <p:commandButton id="blockButton" icon="pi pi-ban" title="Bloquear"
                                                     update=":listForm :globalMessages" process="@this" styleClass="ml-1"
                                                     rendered="#{device.status != 'BLOCKED'}"
                                                     action="#{deviceBean.block(device)}">
                                        <f:param name="device" value="#{device}" />
                                    </p:commandButton>
                                    <p:commandButton id="activateButton" icon="pi pi-check" title="Activar"
                                                     update=":listForm :globalMessages" process="@this" styleClass="ml-1"
                                                     rendered="#{device.status == 'BLOCKED'}"
                                                     action="#{deviceBean.activate(device)}">
                                        <f:param name="device" value="#{device}" />
                                    </p:commandButton>
                                    <p:commandButton id="retireButton" icon="pi pi-trash" title="Retirar"
                                                     update=":listForm :globalMessages" process="@this" styleClass="ml-1"
                                                     rendered="#{device.status != 'RETIRED'}"
                                                     action="#{deviceBean.retire(device)}">
                                        <f:param name="device" value="#{device}" />
                                    </p:commandButton>
                                </p:column>
                            </p:dataTable>
                        </h:form>
                    </div>
                </div>
            </div>
        </div>
    </ui:define>

</ui:composition>
