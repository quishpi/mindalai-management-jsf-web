<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets" xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template/template.xhtml">
    <f:metadata>
        <f:viewAction action="#{licenseBean.load}" onPostBack="false" />
    </f:metadata>

    <ui:define name="title">Licencias - MINDALAI Platform Management</ui:define>
    <ui:define name="viewname">Licencias</ui:define>

    <ui:define name="content">

        <p:messages id="globalMessages" showSummary="false" showDetail="true" closable="true" />

        <div class="grid">
            <div class="col-12">
                <h1 class="text-3xl font-medium">Licencias</h1>
                <p class="text-color-secondary">Emision y revocacion de claves por suscripcion</p>
            </div>

            <div class="col-12 lg:col-4">
                <div class="card">
                    <div class="card-content">
                        <h2 class="text-xl font-semibold mb-3">Emitir licencia</h2>
                        <h:form id="licenseForm">
                            <div class="field">
                                <p:outputLabel for="tenantId" value="Tenant *" />
                                <p:selectOneMenu id="tenantId" value="#{licenseBean.tenantId}" required="true"
                                                 requiredMessage="Seleccione un tenant" filter="true"
                                                 styleClass="w-full">
                                    <f:selectItem itemLabel="Seleccione un tenant" itemValue=""
                                                  noSelectionOption="true" />
                                    <f:selectItems value="#{licenseBean.activeTenants()}" var="tenant"
                                                   itemLabel="#{tenant.displayName()} - #{tenant.ruc}"
                                                   itemValue="#{tenant.id}" />
                                    <p:ajax listener="#{licenseBean.onTenantChange}" update="subscriptionsPanel :globalMessages" />
                                </p:selectOneMenu>
                            </div>

                            <h:panelGroup id="subscriptionsPanel" layout="block">
                                <div class="field">
                                    <p:outputLabel for="subscriptionId" value="Suscripcion *" />
                                    <p:selectOneMenu id="subscriptionId" value="#{licenseBean.subscriptionId}"
                                                     required="true" styleClass="w-full">
                                        <f:selectItem itemLabel="Seleccione una suscripcion" itemValue=""
                                                      noSelectionOption="true" />
                                        <f:selectItems value="#{licenseBean.activeSubscriptions()}" var="subscription"
                                                       itemLabel="#{subscription.planCode} - #{subscription.status}"
                                                       itemValue="#{subscription.id}" />
                                    </p:selectOneMenu>
                                </div>
                            </h:panelGroup>

                            <div class="formgrid grid">
                                <div class="field col-6">
                                    <p:outputLabel for="validFrom" value="Valida desde" />
                                    <p:datePicker id="validFrom" value="#{licenseBean.validFrom}"
                                                  dateFormat="dd/MM/yyyy" showIcon="true" styleClass="w-full" />
                                </div>
                                <div class="field col-6">
                                    <p:outputLabel for="validUntil" value="Valida hasta" />
                                    <p:datePicker id="validUntil" value="#{licenseBean.validUntil}"
                                                  dateFormat="dd/MM/yyyy" showIcon="true" styleClass="w-full" />
                                </div>
                            </div>

                            <p:commandButton id="issueButton" value="Emitir" icon="pi pi-key" update=":licenseForm :listForm :globalMessages"
                                             process="@form" action="#{licenseBean.issue}" styleClass="mt-3" />
                        </h:form>
                    </div>
                </div>
            </div>

            <div class="col-12 lg:col-8">
                <div class="card">
                    <div class="card-content">
                        <h:form id="filterForm">
                            <div class="formgrid grid">
                                <div class="field col-12 md:col-8">
                                    <p:outputLabel for="tenantFilter" value="Filtrar por tenant" />
                                    <p:selectOneMenu id="tenantFilter" value="#{licenseBean.tenantFilter}"
                                                     filter="true" styleClass="w-full">
                                        <f:selectItem itemLabel="Todos los tenants" itemValue=""
                                                      noSelectionOption="true" />
                                        <f:selectItems value="#{licenseBean.activeTenants()}" var="filterTenant"
                                                       itemLabel="#{filterTenant.displayName()}"
                                                       itemValue="#{filterTenant.id}" />
                                    </p:selectOneMenu>
                                </div>
                                <div class="field col-12 md:col-4 flex align-items-end">
                                    <p:commandButton id="filterButton" value="Filtrar" icon="pi pi-filter"
                                                     update=":filterForm :listForm :globalMessages" process="@form"
                                                     action="#{licenseBean.load}" styleClass="w-full" />
                                </div>
                            </div>
                        </h:form>

                        <h:form id="listForm">
                            <p:dataTable id="licensesTable" value="#{licenseBean.licenses}" var="license"
                                         paginator="true" rows="10" emptyMessage="No hay licencias emitidas">
                                <p:column headerText="Clave">
                                    <h:outputText value="#{license.licenseKey}" />
                                </p:column>
                                <p:column headerText="Tenant">
                                    <h:outputText value="#{license.tenantName}" />
                                </p:column>
                                <p:column headerText="Estado">
                                    <p:tag value="#{license.status}" severity="info" />
                                </p:column>
                                <p:column headerText="Valida hasta">
                                    <h:outputText value="#{license.validUntil}" />
                                </p:column>
                                <p:column headerText="Acciones" style="width:8rem">
                                    <p:commandButton id="revokeButton" icon="pi pi-ban" title="Revocar"
                                                     update=":revokePanelWrapper :listForm :globalMessages" process="@this"
                                                     rendered="#{license.status != 'REVOKED'}"
                                                     action="#{licenseBean.prepareRevoke(license)}">
                                        <f:param name="license" value="#{license}" />
                                    </p:commandButton>
                                </p:column>
                            </p:dataTable>
                        </h:form>

                        <h:panelGroup id="revokePanelWrapper" layout="block">
                                                    <h:panelGroup id="revokePanel" layout="block"
                                                                  rendered="#{licenseBean.revokingId != null}" styleClass="card mt-3">
                                                        <h:form id="revokeForm">
                                                            <div class="card-content">
                                                                <h3 class="text-lg font-medium">Revocar licencia</h3>
                                                                <div class="field">
                                                                    <p:outputLabel for="revokeReason" value="Motivo" />
                                                                    <p:inputTextarea id="revokeReason" value="#{licenseBean.revokeReason}"
                                                                                     rows="2" styleClass="w-full" />
                                                                </div>
                                                                <p:commandButton id="confirmRevokeButton" value="Confirmar revocacion"
                                                                                 severity="danger" icon="pi pi-ban" update=":revokePanelWrapper :listForm :globalMessages" process="@form"
                                                                                 action="#{licenseBean.revoke}" />
                                                                <p:commandButton id="cancelRevokeButton" value="Cancelar"
                                                                                 severity="secondary" icon="pi pi-times" update=":revokePanelWrapper :listForm :globalMessages"
                                                                                 process="@form" styleClass="ml-2"
                                                                                 action="#{licenseBean.cancelRevoke}" />
                                                            </div>
                                                        </h:form>
                                                    </h:panelGroup>
                        </h:panelGroup>
                    </div>
                </div>
            </div>
        </div>
    </ui:define>

</ui:composition>
