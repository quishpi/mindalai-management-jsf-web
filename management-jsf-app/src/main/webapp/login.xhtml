<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">
<h:head><title>MindalAI - Platform Management Login</title></h:head>
<h:body style="background:#f8f9fa; display:flex; justify-content:center; align-items:center; height:100vh;">
    <h:form style="background:white; padding:2rem; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.1); min-width:380px;">
        <h2 style="text-align:center; color:#2c3e50;">Platform Management</h2>
        <p:messages autoUpdate="true" />
        <p:panelGrid columns="1" style="width:100%">
            <p:outputLabel for="user" value="Usuario" />
            <p:inputText id="user" value="#{loginBean.username}" required="true" style="width:100%" placeholder="admin"/>
            <p:outputLabel for="pass" value="Contraseña" />
            <p:password id="pass" value="#{loginBean.password}" required="true" style="width:100%" feedback="false" placeholder="admin"/>
            <p:commandButton value="Ingresar" action="#{loginBean.login}" ajax="false" style="width:100%; margin-top:1rem;" />
        </p:panelGrid>
        <p style="text-align:center; margin-top:1rem; font-size:0.9em; color:#666;">Fase 1 - demo: admin/admin</p>
    </h:form>
</h:body>
</html>
