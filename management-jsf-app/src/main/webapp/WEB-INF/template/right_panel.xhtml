<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets" xmlns:p="http://primefaces.org/ui">

    <div id="layout-right-panel">
        <div class="right-panel-scroll-content">
            <h:form id="profileForm">
                <div class="card">
                    <div class="card-content">
                        <div class="flex align-items-center justify-content-between mb-3">
                            <span class="text-xl font-semibold">Sesion</span>
                            <i class="pi pi-shield text-cyan-500" />
                        </div>
                        <ul class="list-none p-0 m-0 border-top border-surface pt-3">
                            <li class="flex justify-content-between py-2">
                                <span class="text-color-secondary">Operador</span>
                                <span class="font-medium">#{authSession.displayName()}</span>
                            </li>
                            <li class="flex justify-content-between py-2">
                                <span class="text-color-secondary">Usuario</span>
                                <span class="font-medium">#{authSession.username}</span>
                            </li>
                            <li class="flex justify-content-between py-2">
                                <span class="text-color-secondary">Roles</span>
                                <span class="font-medium">#{authSession.roleLabel()}</span>
                            </li>
                        </ul>
                    </div>
                </div>

                <div class="card">
                    <div class="card-content">
                        <div class="flex align-items-center justify-content-between mb-3">
                            <span class="text-xl font-semibold">Accesos directos</span>
                            <i class="pi pi-bolt text-cyan-500" />
                        </div>
                        <ul class="list-none p-0 m-0">
                            <li class="mb-2">
                                <h:link outcome="/licenses" styleClass="flex align-items-center">
                                    <i class="pi pi-key mr-2" /> <span>Emitir licencia</span>
                                </h:link>
                            </li>
                            <li class="mb-2">
                                <h:link outcome="/support" styleClass="flex align-items-center">
                                    <i class="pi pi-life-ring mr-2" /> <span>Ver tickets abiertos</span>
                                </h:link>
                            </li>
                            <li class="mb-2">
                                <h:link outcome="/audit" styleClass="flex align-items-center">
                                    <i class="pi pi-shield mr-2" /> <span>Auditoria reciente</span>
                                </h:link>
                            </li>
                        </ul>
                    </div>
                </div>
            </h:form>
        </div>
    </div>

</ui:composition>
