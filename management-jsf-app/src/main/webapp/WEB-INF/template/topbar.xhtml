<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets" xmlns:p="http://primefaces.org/ui">

    <div class="layout-topbar">
        <h:link outcome="/dashboard" styleClass="logo-container">
            <span class="app-name">MINDALAI</span>
        </h:link>

        <div class="topbar-content">
            <a href="#" id="topbar-sidebar-button">
                <i class="pi pi-bars"></i>
            </a>

            <div class="topbar-logout">
                <h:form id="logoutForm">
                    <p:commandButton id="logoutButton" value="Salir" icon="pi pi-sign-out" severity="secondary"
                                      styleClass="topbar-logout-button"
                                      action="#{loginBean.logout}" update="@none" />
                </h:form>
            </div>
        </div>
    </div>

</ui:composition>
