<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets" xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template/template.xhtml">
    <f:metadata>
        <f:viewAction action="#{supportBean.load}" onPostBack="false" />
    </f:metadata>

    <ui:define name="title">Soporte - MINDALAI Platform Management</ui:define>
    <ui:define name="viewname">Soporte</ui:define>

    <ui:define name="content">

        <p:messages id="globalMessages" showSummary="false" showDetail="true" closable="true" />

        <div class="grid">
            <div class="col-12">
                <h1 class="text-3xl font-medium">Soporte</h1>
                <p class="text-color-secondary">Tickets de incidentes de la plataforma</p>
            </div>

            <div class="col-12 lg:col-4">
                <div class="card">
                    <div class="card-content">
                        <h2 class="text-xl font-semibold mb-3">Abrir ticket</h2>
                        <h:form id="ticketForm">
                            <div class="field">
                                <p:outputLabel for="tenantId" value="Tenant *" />
                                <p:selectOneMenu id="tenantId" value="#{supportBean.tenantId}" required="true"
                                                 requiredMessage="Seleccione un tenant" filter="true"
                                                 styleClass="w-full">
                                    <f:selectItem itemLabel="Seleccione un tenant" itemValue=""
                                                  noSelectionOption="true" />
                                    <f:selectItems value="#{supportBean.tenants}" var="tenant"
                                                   itemLabel="#{tenant.displayName()} - #{tenant.ruc}"
                                                   itemValue="#{tenant.id}" />
                                    <p:ajax listener="#{supportBean.onTenantChange}" update="installationsPanel :globalMessages" />
                                </p:selectOneMenu>
                            </div>

                            <h:panelGroup id="installationsPanel" layout="block">
                                <div class="field">
                                    <p:outputLabel for="installationId" value="Instalacion" />
                                    <p:selectOneMenu id="installationId" value="#{supportBean.installationId}"
                                                     filter="true" styleClass="w-full">
                                        <f:selectItem itemLabel="Sin instalacion" itemValue=""
                                                      noSelectionOption="true" />
                                        <f:selectItems value="#{supportBean.installations}" var="installation"
                                                       itemLabel="#{installation.name}"
                                                       itemValue="#{installation.id}" />
                                    </p:selectOneMenu>
                                </div>
                            </h:panelGroup>

                            <div class="field">
                                <p:outputLabel for="subject" value="Asunto *" />
                                <p:inputText id="subject" value="#{supportBean.subject}" required="true"
                                             requiredMessage="El asunto es obligatorio" styleClass="w-full" />
                            </div>

                            <div class="field">
                                <p:outputLabel for="priority" value="Prioridad" />
                                <p:selectOneMenu id="priority" value="#{supportBean.priority}" styleClass="w-full">
                                    <f:selectItems value="#{supportBean.priorities()}" var="priority"
                                                   itemLabel="#{priority}" itemValue="#{priority}" />
                                </p:selectOneMenu>
                            </div>

                            <div class="field">
                                <p:outputLabel for="description" value="Descripcion *" />
                                <p:inputTextarea id="description" value="#{supportBean.description}" required="true"
                                                 requiredMessage="La descripcion es obligatoria" rows="4"
                                                 styleClass="w-full" />
                            </div>

                            <p:commandButton id="openButton" value="Abrir ticket" icon="pi pi-plus" update=":ticketForm :listForm :globalMessages"
                                             process="@form" action="#{supportBean.openTicket}"
                                             styleClass="mt-3" />
                        </h:form>
                    </div>
                </div>
            </div>

            <div class="col-12 lg:col-8">
                <div class="card">
                    <div class="card-content">
                        <h:form id="filterForm">
                            <div class="formgrid grid">
                                <div class="field col-12 md:col-8">
                                    <p:outputLabel for="tenantFilter" value="Filtrar por tenant" />
                                    <p:selectOneMenu id="tenantFilter" value="#{supportBean.tenantFilter}"
                                                     filter="true" styleClass="w-full">
                                        <f:selectItem itemLabel="Todos los tenants" itemValue=""
                                                      noSelectionOption="true" />
                                        <f:selectItems value="#{supportBean.tenants}" var="filterTenant"
                                                       itemLabel="#{filterTenant.displayName()}"
                                                       itemValue="#{filterTenant.id}" />
                                    </p:selectOneMenu>
                                </div>
                                <div class="field col-12 md:col-4 flex align-items-end">
                                    <p:commandButton id="filterButton" value="Filtrar" icon="pi pi-filter"
                                                     update=":filterForm :listForm :globalMessages" process="@form" action="#{supportBean.load}"
                                                     styleClass="w-full" />
                                </div>
                            </div>
                        </h:form>

                        <h:form id="listForm">
                            <div class="field mb-3">
                                <p:outputLabel for="assignTo"
                                               value="Operador responsable para el ticket seleccionado" />
                                <p:selectOneMenu id="assignTo" value="#{supportBean.assignTo}" filter="true"
                                                 styleClass="w-full">
                                    <f:selectItem itemLabel="Seleccione un operador" itemValue=""
                                                  noSelectionOption="true" />
                                    <f:selectItems value="#{supportBean.activeOperators()}" var="operator"
                                                   itemLabel="#{operator.displayName()} - #{operator.username}"
                                                   itemValue="#{operator.id}" />
                                </p:selectOneMenu>
                                <small class="text-color-secondary">Solo tickets OPEN pueden asignarse; al asignar, el ticket pasa a IN_PROGRESS.</small>
                            </div>
                            <p:dataTable id="ticketsTable" value="#{supportBean.tickets}" var="ticket"
                                         paginator="true" rows="10" emptyMessage="No hay tickets registrados">
                                <p:column headerText="Asunto">
                                    <h:outputText value="#{ticket.subject}" />
                                </p:column>
                                <p:column headerText="Tenant">
                                    <h:outputText value="#{ticket.tenantName}" />
                                </p:column>
                                <p:column headerText="Instalacion">
                                    <h:outputText value="#{empty ticket.installationId ? 'Sin instalacion' : ticket.installationId}" />
                                </p:column>
                                <p:column headerText="Descripcion">
                                    <h:outputText value="#{ticket.description}" />
                                </p:column>
                                <p:column headerText="Prioridad">
                                    <p:tag value="#{ticket.priority}" severity="info" />
                                </p:column>
                                <p:column headerText="Estado">
                                    <p:tag value="#{ticket.status}" severity="info" />
                                </p:column>
                                <p:column headerText="Responsable">
                                    <h:outputText value="#{ticket.assignedTo}" />
                                </p:column>
                                <p:column headerText="Abierto">
                                    <h:outputText value="#{ticket.createdAt}" />
                                </p:column>
                                <p:column headerText="Acciones" style="width:16rem">
                                    <p:commandButton id="assignButton" icon="pi pi-user-plus" title="Asignar"
                                                     update=":ticketForm :listForm :globalMessages" process="@form"
                                                     rendered="#{ticket.status == 'OPEN'}"
                                                     action="#{supportBean.assign(ticket)}">
                                        <f:param name="ticket" value="#{ticket}" />
                                    </p:commandButton>
                                    <p:commandButton id="resolveButton" icon="pi pi-check" title="Resolver"
                                                     update=":resolvePanelWrapper :listForm :globalMessages" process="@this" styleClass="ml-1"
                                                     rendered="#{ticket.status == 'IN_PROGRESS'}"
                                                     action="#{supportBean.prepareResolve(ticket)}">
                                        <f:param name="ticket" value="#{ticket}" />
                                    </p:commandButton>
                                    <p:commandButton id="closeButton" icon="pi pi-lock" title="Cerrar"
                                                     update=":listForm :globalMessages" process="@this" styleClass="ml-1"
                                                     rendered="#{ticket.status == 'RESOLVED'}"
                                                     action="#{supportBean.close(ticket)}">
                                        <f:param name="ticket" value="#{ticket}" />
                                    </p:commandButton>
                                </p:column>
                            </p:dataTable>
                        </h:form>


                        <h:panelGroup id="resolvePanelWrapper" layout="block">
                                                    <h:panelGroup id="resolvePanel" layout="block"
                                                                  rendered="#{supportBean.resolvingId != null}"
                                                                  styleClass="card mt-3">
                                                        <h:form id="resolveForm">
                                                            <div class="card-content">
                                                                <h3 class="text-lg font-medium">Resolver ticket</h3>
                                                                <div class="field">
                                                                    <p:outputLabel for="resolution" value="Resolucion *" />
                                                                    <p:inputTextarea id="resolution" value="#{supportBean.resolution}"
                                                                                     required="true" rows="3" styleClass="w-full"
                                                                                     requiredMessage="Indique la resolucion del ticket" />
                                                                </div>
                                                                <div class="flex justify-content-between">
                                                                    <p:commandButton id="confirmResolveButton" value="Confirmar resolucion"
                                                                                     icon="pi pi-check" update=":resolvePanelWrapper :listForm :globalMessages"
                                                                                     process="@form" action="#{supportBean.resolve}" />
                                                                    <p:commandButton id="cancelResolveButton" value="Cancelar" icon="pi pi-times"
                                                                                     severity="secondary" update=":resolvePanelWrapper :listForm :globalMessages"
                                                                                     process="@form" action="#{supportBean.cancelResolve}" />
                                                                </div>
                                                            </div>
                                                        </h:form>
                                                    </h:panelGroup>
                        </h:panelGroup>
                    </div>
                </div>
            </div>
        </div>
    </ui:define>

</ui:composition>
