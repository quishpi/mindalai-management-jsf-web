# Desarrollo local: el API y el JSF corren sobre http://localhost, por lo que una cookie
# Secure no viaja y la sesion no se persistiria. En produccion usar SESSION_COOKIE_SECURE=true.
app:
  api:
    base-url: ${API_HOST:http://localhost}:${API_PORT:9094}

server:
  servlet:
    session:
      cookie:
        secure: false

logging:
  level:
    ec.mindalai.managementjsf: DEBUG
