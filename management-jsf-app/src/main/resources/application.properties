server.port=${SERVER_PORT:9096}
spring.application.name=mindalai-management-jsf-web
app.api.base-url=${API_HOST:http://localhost}:${API_PORT:9094}
app.api.timeout=${API_TIMEOUT:5000}
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
logging.level.ec.mindalai.management.jsf=INFO
management.endpoints.web.exposure.include=health,info
joinfaces.primefaces.theme=harmony
